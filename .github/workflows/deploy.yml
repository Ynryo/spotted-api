name: Deploy

on:
  push:
    branches:
      - main

jobs:
  #1 tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, redis, pdo_mysql, zip
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Vérification de la configuration Symfony
      - name: Lint YAML Configuration
        run: php bin/console lint:yaml config --parse-tags
      - name: Validate Symfony Container
        run: php bin/console lint:container

      # Tests Statiques (PHPStan)
      - name: Run Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      # Tests Dynamiques (PHPUnit)
      - name: Run Dynamic Unit Tests (PHPUnit)
        run: vendor/bin/phpunit


  #2 deploy
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEBIAN_HOST }}
          username: ${{ secrets.DEBIAN_USER }}
          key: ${{ secrets.DEBIAN_SSH_KEY }}
          script: |
            cd /var/www/html/spotted-api
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
