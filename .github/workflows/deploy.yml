name: Deploy

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.DEBIAN_HOST }}
                  username: ${{ secrets.DEBIAN_USER }}
                  key: ${{ secrets.DEBIAN_SSH_KEY }}
                  script: |
                      cd /var/www/html/spotted-api
                      ./deploy.sh
