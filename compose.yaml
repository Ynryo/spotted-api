services:
  php:
    container_name: spotted-api-php
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/app
    environment:
      SERVER_NAME: ":80"
    extra_hosts:
      - "host_server:host-gateway"
    networks:
      - spotted-network

networks:
  spotted-network:
    driver: bridge