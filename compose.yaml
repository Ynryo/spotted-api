services:
  redis:
    container_name: spotted-api-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - spotted-network

  php:
    container_name: spotted-api-php
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/app
    environment:
      SERVER_NAME: ":80"
    extra_hosts:
      - "host_server:host-gateway"
    networks:
      - spotted-network

  worker:
    container_name: spotted-api-worker
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      SERVER_NAME: ":80"
    networks:
      - spotted-network
    command: ["php", "bin/console", "app:sync-markers", "--watch"]
    healthcheck:
      disable: true

networks:
  spotted-network:
    driver: bridge
